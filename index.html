<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-cuidado Diario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik+Doodle+Shadow&display=swap');
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://wallpapercave.com/wp/wp5128415.jpg');
            background-size: cover;
            background-position: center;
            font-family: 'Rubik Doodle Shadow', cursive;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
        }
        #message {
            font-size: 1.5rem;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background-color: rgba(255, 193, 7, 0.8);
            color: #212529;
        }
        button {
            font-size: 1.2rem;
            padding: 10px 20px;
            border-radius: 10px;
            background-color: #ff4da6;
            border: none;
            color: white;
            transition: 0.3s;
        }
        button:hover {
            background-color: #ff3377;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">✨ Auto-cuidado Diario ✨</h1>
        <button id="generateMessage" class="btn">¿Qué necesito hoy?</button>
        <div id="message" class="animate__animated animate__fadeIn mt-3"></div>
    </div>
    
    <script>
        const messages = [
            "🍵 Tómate un té y relájate como en un anime de slice of life!",
            "🎵 Escucha tu opening favorito y sube el ánimo!",
            "🌸 Sal a caminar como si estuvieras en un anime de primavera!",
            "💖 Date un momento para escribir tus pensamientos en un diario, como un protagonista profundo!",
            "🍙 Prepara un bocadillo delicioso y siéntete en un picnic de anime!",
            "🧘‍♀️ Haz una pausa, respira hondo y relájate como un maestro zen del anime!",
            "🎮 Juega un poco a tu videojuego favorito y recarga energías!",
            "📖 Lee un manga o novela ligera para desconectar y disfrutar!"
        ];
        
        document.getElementById("generateMessage").addEventListener("click", function() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            const messageElement = document.getElementById("message");
            messageElement.textContent = messages[randomIndex];
            messageElement.classList.add("animate__fadeIn");
        });
    </script>
</body>
</html>
